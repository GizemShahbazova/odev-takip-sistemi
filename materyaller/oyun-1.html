<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>School Life | Vocabulary Challenge</title><style>
:root{font-family:Arial,sans-serif;color:#172554;background:#eff6ff}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:850px;margin:auto}.hero{background:linear-gradient(110deg,#0369a1,#4338ca);color:white;border-radius:22px;padding:28px}.hero h1{margin:8px 0;font-size:38px}.card{background:white;border:1px solid #cbd5e1;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 8px 24px #1e3a8a12}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.level,.option{cursor:pointer;background:#f8fafc;border:2px solid #cbd5e1;border-radius:14px;padding:18px;text-align:left;font-size:17px;color:#172554}.level:hover,.option:hover:not(:disabled){border-color:#6366f1;background:#eef2ff}.level strong{display:block;margin:8px 0}.level small{color:#64748b}.option{display:block;width:100%;margin:10px 0;font-weight:600}.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534}.option.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b}.option:disabled{cursor:default}.top{display:flex;justify-content:space-between;font-weight:bold}.track{background:#dbeafe;height:10px;border-radius:20px;margin:16px 0;overflow:hidden}.fill{height:100%;background:#4f46e5;width:0;transition:width .25s}.tag{color:#64748b;text-transform:uppercase;font-size:13px;letter-spacing:1px;font-weight:bold}.question{font-size:25px;margin:18px 0 24px}.feedback{min-height:24px;font-weight:bold;margin-top:16px}.primary{cursor:pointer;background:#4338ca;color:white;border:0;border-radius:13px;padding:15px 24px;font-size:17px;font-weight:bold;width:100%;margin-top:14px}.primary:hover{background:#3730a3}.hidden{display:none}.center{text-align:center}.scorebig{font-size:44px;font-weight:800}.note{color:#64748b}footer{text-align:center;color:#64748b;font-size:13px;margin:25px}@media(max-width:540px){body{padding:12px}.hero h1{font-size:28px}.levels{grid-template-columns:1fr}.card{padding:16px}.question{font-size:21px}}
</style><style>.materials-return{display:inline-block;margin:0 0 18px;padding:10px 14px;background:white;border:1px solid #cbd5e1;border-radius:7px;font:600 14px Arial,sans-serif;color:#344a5e;text-decoration:none}.materials-return:focus-visible{outline:3px solid #7ba8cf;outline-offset:3px}</style></head><body><a class="materials-return" href="./">← Materyallere dön</a><main class="wrap"><header class="hero"><div>GRADE 6 • THEME 1</div><h1>🏫 SCHOOL LIFE</h1><div>Vocabulary Challenge 🎯</div></header>
<section id="start" class="card"><h2>Choose your challenge!</h2><div class="levels"><button class="level" data-level="easy">🌱 <strong>Easy</strong><small>Word meanings</small></button><button class="level" data-level="medium">⚡ <strong>Medium</strong><small>Definitions</small></button><button class="level" data-level="hard">🏆 <strong>Hard</strong><small>Complete the sentences</small></button><button class="level" data-level="mixed">🎲 <strong>Mixed</strong><small>All levels</small></button></div><p class="note">10 questions • 10 points each • Instant feedback</p></section>
<section id="play" class="hidden"><div class="card"><div class="top"><span id="counter"></span><span id="score"></span></div><div class="track"><div id="progress" class="fill"></div></div><div class="tag" id="category"></div><h2 id="question" class="question"></h2><div id="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">Next question →</button></div></section>
<section id="end" class="card center hidden"><div id="medal" style="font-size:65px">🏆</div><h2>Challenge Complete!</h2><div id="final" class="scorebig"></div><p id="message"></p><button id="restart" class="primary">Play Again ↻</button></section><footer>Based on Grade 6 English • Theme 1: School Life</footer></main>
<script>
'use strict';
const questions=[
['easy','School places','a conference hall','Konferans salonu',['Konferans salonu','Spor sahası','Kütüphane','Kantin']],
['easy','School places','a canteen','Kantin',['Laboratuvar','Kantin','Sınıf','Bahçe']],
['easy','School places','a playground','Oyun alanı',['Öğretmenler odası','Tören','Oyun alanı','Müdür']],
['easy','School places','a library','Kütüphane',['Kütüphane','Kantin','Spor kulübü','Sınıf']],
['easy','School life','a headmaster','Okul müdürü',['Öğrenci','Sekreter','Okul müdürü','Veli']],
['easy','School life','a secretary','Sekreter',['Sekreter','Lider','Öğretmen','Dinleyici']],
['easy','Celebrations','a parade','Geçit töreni',['Konuşma','Geçit töreni','Sınav','Ders']],
['easy','Celebrations','a national anthem','Millî marş',['Millî marş','Kulüp','Ödev','Yarışma']],
['easy','School routines','to borrow','Ödünç almak',['Ödünç vermek','Ödünç almak','Kutlamak','Bağırmak']],
['easy','School routines','to greet','Selamlamak',['Unutmak','Selamlamak','Geçmek','Düzenlemek']],
['easy','School routines','to follow','Uymak / takip etmek',['Başarısız olmak','Ödünç vermek','Uymak / takip etmek','Ayrılmak']],
['easy','School routines','to fail','Başarısız olmak',['Başarısız olmak','Başarmak','Denemek','Yardım etmek']],
['medium','Definitions','A person who is in charge of a school.','a headmaster',['a secretary','a headmaster','a parent','a listener']],
['medium','Definitions','A meeting of teachers and students at school.','an assembly',['a parade','an interview','an assembly','a talent show']],
['medium','Definitions','A public celebration with people walking together.','a parade',['a parade','a speech','a lesson','a lab']],
['medium','Definitions','To give something to someone for a short time.','to lend',['to borrow','to lend','to fail','to greet']],
['medium','Definitions','To take something from someone and return it later.','to borrow',['to celebrate','to lend','to borrow','to lead']],
['medium','Definitions','To do well in a test.','to pass',['to fail','to try','to enter','to pass']],
['medium','Definitions','To offer help or be useful.','helpful',['helpful','late','angry','quiet']],
['medium','Definitions','To put things in a bag.','to pack',['to solve','to pack','to shout','to follow']],
['medium','Definitions','A room where students do science experiments.','a lab',['a canteen','a library','a lab','a playground']],
['medium','Definitions','A formal talk given to an audience.','a speech',['a parade','a speech','an anthem','a term']],
['hard','Complete the sentence','We always ______ the school rules.','follow',['borrow','follow','fail','pack']],
['hard','Complete the sentence','Our headmaster gives a ______ at the ceremony.','speech',['parade','speech','canteen','flag']],
['hard','Complete the sentence','Students sing the national ______ at the ceremony.','anthem',['leader','anthem','assembly','lab']],
['hard','Complete the sentence','I usually ______ books from the school library.','borrow',['lend','borrow','shout','fail']],
['hard','Complete the sentence','Our teacher ______ us in the morning.','greets',['fails','borrows','greets','packs']],
['hard','Complete the sentence','The students ______ the classroom for Republic Day.','decorate',['fail','decorate','borrow','solve']],
['hard','Complete the sentence','We ______ up when we hear the bell.','line',['lend','line','celebrate','pack']],
['hard','Complete the sentence','The teacher gives us ______ before the activity.','instructions',['parades','instructions','anthems','flags']],
['hard','Complete the sentence','I always ______ my books before I leave school.','pack',['fail','pack','lead','lend']],
['hard','Complete the sentence','We ______ Republic Day on 29 October.','celebrate',['borrow','greet','celebrate','solve']]
];
const $=id=>document.getElementById(id);let round=[],index=0,points=0,answered=false;
function shuffle(list){let a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function screen(which){for(const id of ['start','play','end'])$(id).classList.toggle('hidden',id!==which);}
function start(level){round=shuffle(questions.filter(q=>level==='mixed'||q[0]===level)).slice(0,10);index=0;points=0;screen('play');render();}
function render(){answered=false;const q=round[index];$('counter').textContent=`Question ${index+1} / ${round.length}`;$('score').textContent=`⭐ ${points} points`;$('progress').style.width=`${index/round.length*100}%`;$('category').textContent=q[1];$('question').textContent=q[0]==='easy'?`What does “${q[2]}” mean?`:q[2];$('feedback').textContent='';$('next').classList.add('hidden');$('options').replaceChildren();shuffle(q[4]).forEach((choice,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[i]}. ${choice}`;b.addEventListener('click',()=>answer(choice,b));$('options').appendChild(b);});}
function answer(choice,selected){if(answered)return;answered=true;const q=round[index],correct=choice===q[3];if(correct)points+=10;for(const b of $('options').children){b.disabled=true;const text=b.textContent.slice(3);if(text===q[3])b.classList.add('correct');else if(b===selected)b.classList.add('wrong');}$('feedback').textContent=correct?'✓ Excellent! Correct answer!':`✗ Not quite! Correct answer: ${q[3]}`;$('score').textContent=`⭐ ${points} points`;$('next').textContent=index===round.length-1?'See my results →':'Next question →';$('next').classList.remove('hidden');}
function next(){index++;if(index<round.length){render();return;}screen('end');$('final').textContent=`${points} / 100`;$('medal').textContent=points>=90?'🏆':points>=60?'🌟':'📚';$('message').textContent=points>=90?'Outstanding! You are a School Life champion!':points>=60?'Great work! Keep practising!':'Keep learning! You can try again!';}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.level)));$('next').addEventListener('click',next);$('restart').addEventListener('click',()=>screen('start'));
</script></body></html>
